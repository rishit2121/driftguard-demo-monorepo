name: security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-ts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/billing-ts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

  account-js:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/account-js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

  ingestion-py:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ingestion-py } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt pytest==8.3.3
      - run: python -m pytest -q

  audit-java:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/audit-java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: mvn -B -q test

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (DriftGuard rules) - report only
        run: |
          semgrep scan --config .semgrep --metrics=off --json --output semgrep.json --exclude node_modules . || true
          python3 -c "import json; d=json.load(open('semgrep.json')); print(len(d['results']), 'findings'); [print(r['check_id'], r['path'], r['start']['line']) for r in d['results']]"
      - uses: actions/upload-artifact@v4
        with: { name: semgrep-results, path: semgrep.json }
